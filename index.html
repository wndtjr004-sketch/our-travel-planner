<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리의 여행 플래너</title>
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--ink:#1D2a2E;--sub:#6A7378;--line:#E5E0D7;--acc:#0E7C6B;--accInk:#fff;--soft:#E8F3F0;--coral:#D9654B;--coralSoft:#FBEAE5;--warn:#9A5B06;--warnSoft:#FDF3E1;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:720px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}
.top h1{font-size:22px;line-height:1.3;margin:0;letter-spacing:-.3px}
.top .meta{color:var(--sub);font-size:13px;margin-top:2px}
.dday{background:var(--acc);color:var(--accInk);border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}
.sec h2{font-size:15px;margin:0}
.sec .more{font-size:13px;color:var(--sub);background:none;border:0;padding:4px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--acc);vertical-align:middle}
.tag.intl{background:var(--coralSoft);color:var(--coral)}
.tag.warn{background:var(--warnSoft);color:var(--warn)}
.ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.ico.intl{background:var(--coralSoft)}
.title{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.route{font-weight:700;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--coral)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;cursor:pointer;text-align:center;font-size:13px}
.chip b{display:block;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.fchip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.stop{display:flex;gap:12px}
.stop .num{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.stop .num.home{background:var(--ink);color:var(--bg)}
.handle{flex:none;align-self:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:10px 6px 10px 12px;color:var(--sub);font-size:20px;line-height:1}
.stop.dragging{position:relative;z-index:8;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:12px;opacity:.96;transition:none}
.stop.dragging .handle{cursor:grabbing}
.dropline{height:3px;background:var(--acc);border-radius:2px;margin:3px 0 3px 40px}
.leg{margin:2px 0 2px 13px;border-left:2px dashed var(--line);padding:6px 0 6px 23px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leg a{font-size:12.5px}
.mapbox{background:var(--soft);border-radius:14px;overflow:hidden;margin-bottom:12px}
.mapbox svg{display:block;width:100%;height:auto}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
.empty .big{font-size:34px}
.notice{background:var(--warnSoft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar .in{display:flex;max-width:720px;width:100%}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 10px;cursor:pointer;color:var(--sub);font-size:11.5px}
.tabbar button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
.tabbar button.on{color:var(--acc);font-weight:700}
.quick{position:fixed;left:0;right:0;bottom:62px;z-index:6;display:none;justify-content:center;padding:8px 12px;background:linear-gradient(transparent,var(--bg) 30%)}
.quick.on{display:flex}
.quick form{display:flex;gap:8px;max-width:696px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 12px;box-shadow:0 4px 16px rgba(0,0,0,.08);align-items:flex-end}
.quick textarea{flex:1;border:0;background:none;resize:none;outline:none;font-size:15px;padding:7px 0;max-height:110px;min-height:22px;line-height:1.45}
.quick button{flex:none}
.qcats{display:flex;gap:5px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}.qcats::-webkit-scrollbar{display:none}
.qcats button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.qcats button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
body.qpad #app{padding-bottom:170px}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--accInk);border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;z-index:6}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);font-weight:700}
.members{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.daycard{display:flex;gap:12px;align-items:center;cursor:pointer}
.daycard .d{width:46px;text-align:center;flex:none}
.daycard .d b{display:block;font-size:18px}
.att{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:4px 6px 0 0;text-decoration:none;color:var(--ink);background:var(--bg)}
/* sheet */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetWrap.open{display:flex}
#sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 12px;font-size:18px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:15px}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio{display:flex;gap:8px}
.radio label{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;cursor:pointer;font-size:14px;color:var(--ink);margin:0}
.radio input{display:none}
.radio input:checked+span{font-weight:700;color:var(--acc)}
.radio label:has(input:checked){border-color:var(--acc);background:var(--soft)}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px}
.ok{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin-bottom:6px}

/* ===== 밝고 트렌디한 테마 ===== */
:root{--bg:#FBF6EE;--card:rgba(255,255,255,.78);--ink:#22253A;--sub:#7A7C8E;--line:#EFE6D8;--acc:#6E78D8;--accInk:#fff;--soft:#EEF0FB;--coral:#E8735C;--coralSoft:#FCEBE5;--warn:#A86A1C;--warnSoft:#FBF0DC;--sand:#D9B88C;--r:20px;
  --grad:linear-gradient(120deg,#7C86DE 0%,#97B6E6 45%,#EE8D76 100%)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 38vmax at 12% 8%,rgba(151,182,230,.28),transparent 60%),radial-gradient(34vmax 34vmax at 92% 22%,rgba(238,141,118,.16),transparent 60%),radial-gradient(40vmax 40vmax at 55% 98%,rgba(217,184,140,.22),transparent 60%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(3vmax,-2vmax,0) rotate(8deg)}100%{transform:translate3d(-2vmax,3vmax,0) rotate(-6deg)}}
.card{background:var(--card);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(19,26,51,.04),0 8px 24px rgba(110,120,216,.07);transition:transform .18s ease,box-shadow .18s ease}
.card[data-act]:active,.stat:active,.daycard:active{transform:scale(.985)}
@media (hover:hover){.card[data-act]:hover,.daycard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(110,120,216,.13)}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 18px;margin:2px 0 16px;color:var(--ink);background:#E9DCC8;box-shadow:0 20px 44px rgba(150,120,80,.28);display:flex;align-items:flex-end;gap:12px;min-height:270px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-4%;background:url(img/hero-couple.webp) 50% 30%/cover no-repeat;z-index:-2;animation:kb 26s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(251,246,238,.97) 0%,rgba(251,246,238,.82) 26%,rgba(251,246,238,0) 58%);pointer-events:none}
@keyframes kb{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,1.5%)}}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero-in{flex:1;min-width:0;position:relative;z-index:1}
.hero h1{font-size:27px;line-height:1.2;margin:2px 0 6px;font-weight:900;letter-spacing:-.6px}
.hero-dest{display:inline-block;font-size:12.5px;font-weight:700;color:var(--acc);background:rgba(255,255,255,.75);border:1px solid #fff;padding:3px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.hero-meta{font-size:13.5px;color:#4A4E66}
.hero-dday{position:relative;z-index:1;background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;padding:10px 13px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.hero-dday b{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.plane{position:absolute;top:14px;left:-40px;font-size:22px;animation:fly 9s linear infinite;z-index:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
@keyframes fly{0%{transform:translate(0,10px) rotate(8deg);opacity:0}8%{opacity:1}50%{transform:translate(55vw,-6px) rotate(-4deg)}92%{opacity:1}100%{transform:translate(110vw,8px) rotate(6deg);opacity:0}}
@media (min-width:720px){@keyframes fly{0%{transform:translate(0,10px) rotate(8deg);opacity:0}8%{opacity:1}100%{transform:translate(760px,8px) rotate(6deg);opacity:0}}}
.top h1{font-size:25px;font-weight:900;letter-spacing:-.6px}
.eyebrow{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.2px}
.dday{background:var(--grad);background-size:200% 200%;animation:flow 10s ease infinite;font-family:'Outfit',sans-serif;font-weight:800;padding:5px 12px;box-shadow:0 6px 16px rgba(110,120,216,.25)}
/* stats */
.stat{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:12px 8px;box-shadow:0 6px 18px rgba(110,120,216,.07);transition:transform .15s}
.stat b{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec h2{font-size:16.5px;font-weight:900;letter-spacing:-.3px}
.ico{border-radius:14px;background:linear-gradient(135deg,#F4EEE4,#EEF0FB)}
.ico.intl{background:linear-gradient(135deg,#FFEFEA,#FFF4E2)}
.tag{border-radius:999px;padding:2px 9px;background:#EEF0FB;color:var(--acc)}
.tag.intl{background:var(--coralSoft);color:var(--coral)}
.route{font-family:'Outfit','Noto Sans KR',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.2px}
/* buttons */
.btn{border-radius:14px;border:1px solid var(--line);background:#fff;transition:transform .12s ease,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--grad);background-size:180% 180%;border:0;color:#fff;box-shadow:0 8px 18px rgba(110,120,216,.28);animation:flow 9s ease infinite}
.btn.sm{border-radius:11px}
.fab{background:var(--grad);background-size:200% 200%;animation:flow 8s ease infinite,pop .5s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 12px 28px rgba(110,120,216,.4);bottom:96px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* chips */
.chip{border-radius:16px;background:#fff;border:1px solid var(--line);padding:8px 14px;transition:all .2s}
.chip b{font-family:'Outfit',sans-serif;font-size:16px}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(110,120,216,.28)}
.fchip{background:#fff;transition:all .15s}
.fchip.on,.qcats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{background:#EAEFF8;border-radius:14px}
.seg button{border-radius:11px;transition:all .2s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(19,26,51,.08)}
/* plan */
.stop .num{background:var(--grad);box-shadow:0 4px 10px rgba(110,120,216,.3);font-family:'Outfit',sans-serif}
.leg{border-left:2px dashed #E3D6C2}
.mapbox{background:linear-gradient(160deg,#EEF0FB,#FBF1EC 60%,#F6EEDF);border:1px solid #fff;box-shadow:inset 0 0 0 1px rgba(110,120,216,.06)}
.mapbox polyline{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.daycard .d b{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{background:var(--grad);color:#fff}
.notice{border-radius:16px}
/* tab bar: floating glass pill */
.tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.9);border-radius:24px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 12px 34px rgba(19,26,51,.12);padding-bottom:0;max-width:696px;margin:0 auto}
.tabbar button{position:relative;transition:color .2s}
.tabbar button i{transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.tabbar button.on{color:var(--acc)}
.tabbar button.on i{transform:translateY(-2px) scale(1.15)}
.tabbar button.on::after{content:"";position:absolute;left:50%;bottom:4px;width:18px;height:4px;margin-left:-9px;border-radius:4px;background:var(--grad)}
#app{padding-bottom:110px}
.quick{bottom:calc(76px + env(safe-area-inset-bottom));background:none}
.quick form{border-radius:22px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 12px 32px rgba(110,120,216,.16)}
body.qpad #app{padding-bottom:265px}
/* sheet */
#sheetWrap{background:rgba(19,26,51,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sheetWrap.open #sheet{animation:sheetUp .32s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
#sheet{border-radius:28px 28px 0 0;background:#fff}
#sheet h3{font-weight:900;font-size:20px;letter-spacing:-.4px}
.f input,.f select,.f textarea{background:#F5F7FC;border-color:#E8ECF5;border-radius:13px;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(110,120,216,.12)}
.toast{border-radius:14px;background:rgba(19,26,51,.9);backdrop-filter:blur(8px)}
/* entrance */
#app.enter>*{animation:up .45s cubic-bezier(.2,.8,.3,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
#app.enter>.tabbar,#app.enter>.fab{animation:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.tag:not(.warn):not(.intl){}
@keyframes shimmer{to{background-position:-200% 0}}
.pending-tag{background:linear-gradient(90deg,#EEF0FB 0%,#F8E9FF 50%,#EEF0FB 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.ico.img{background:linear-gradient(135deg,#F7F1E7,#EEF0FB);overflow:visible}
.cimg{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(120,100,70,.18));transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.card:hover .cimg{transform:rotate(-8deg) scale(1.08)}
.cimg.xs{width:18px;height:18px;margin-right:4px;vertical-align:-4px;filter:none}
.fchip,.qcats button{display:inline-flex;align-items:center}
.eimg{width:170px;height:170px;object-fit:contain;display:block;margin:0 auto 6px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(150,120,80,.18))}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-2deg)}}
.chip.on,.btn.pri,.fab,.dday,.stop .num,.av,.tabbar button.on::after{background-size:200% 200%}
.fchip.on,.qcats button.on{background:var(--ink);color:#fff}
/* 걸어 다니는 미니 캐릭터 */
#minis{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));height:64px;max-width:720px;margin:0 auto;pointer-events:none;z-index:4;overflow:hidden}
body.qpad #minis{display:none}
#app{padding-bottom:150px}
.walker{position:absolute;bottom:12px;left:-110px;display:flex;gap:6px;align-items:flex-end;animation:stroll 34s linear infinite}
@keyframes stroll{0%{left:-110px;transform:scaleX(1)}44%{left:100%;transform:scaleX(1)}50%{left:100%;transform:scaleX(-1)}94%{left:-110px;transform:scaleX(-1)}100%{left:-110px;transform:scaleX(1)}}
.mini{position:relative;width:36px;height:36px;animation:bob .38s ease-in-out infinite alternate}
.mini:first-child{animation-delay:.19s}
.mini img{width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 5px 12px rgba(90,70,40,.28);display:block}
.mini::after{content:"";position:absolute;left:13px;bottom:-8px;width:3px;height:9px;border-radius:2px;background:#5C6079;box-shadow:7px 0 0 #5C6079;animation:legs .38s steps(2) infinite;z-index:-1}
.mini::before{content:"";position:absolute;left:5px;bottom:-12px;width:26px;height:5px;border-radius:50%;background:rgba(90,70,40,.18)}
@keyframes bob{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-5px) rotate(5deg)}}
@keyframes legs{0%{transform:skewX(18deg)}100%{transform:skewX(-18deg)}}
.bag{position:absolute;right:-16px;bottom:-9px;width:13px;height:16px;border-radius:4px;background:var(--coral);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.bag::before{content:"";position:absolute;left:3px;top:-5px;width:7px;height:5px;border:2px solid #B98A57;border-bottom:0;border-radius:3px 3px 0 0;box-sizing:border-box}
.heart{position:absolute;left:30px;top:-16px;color:var(--coral);font-size:15px;opacity:0;animation:heart 34s linear infinite}
@keyframes heart{0%,18%{opacity:0;transform:translateY(4px) scale(.4)}20%{opacity:1;transform:translateY(-4px) scale(1)}25%{opacity:0;transform:translateY(-18px) scale(1.15)}66%{opacity:0;transform:translateY(4px) scale(.4)}68%{opacity:1;transform:translateY(-4px) scale(1)}73%{opacity:0;transform:translateY(-18px) scale(1.15)}100%{opacity:0}}
.duo{display:flex;flex:none}
.duo img{width:42px;height:42px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgba(90,70,40,.2);animation:float 4s ease-in-out infinite}
.duo img+img{margin-left:-12px;animation-delay:.6s}
/* 상단: 이미지 전체가 보이게 */
.hero{display:block;padding:0;min-height:0;background:rgba(255,255,255,.85);border:1px solid #fff}
.hero::before,.hero::after{content:none}
.hero-media{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:26px 26px 0 0}
.hero-img{position:absolute;inset:0;background:url(img/hero-couple.webp) center/cover no-repeat;animation:kb2 18s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb2{from{transform:scale(1)}to{transform:scale(1.045)}}
.hero-media .hero-dday{position:absolute;top:12px;right:12px}
.hero-in{padding:14px 18px 16px}
.hero h1{font-size:24px;margin:6px 0 4px}
.hero-dest{background:var(--soft);border-color:transparent}
/* 아이콘 이미지 */
.cimg.h{width:24px;height:24px;margin-right:6px;vertical-align:-6px;filter:drop-shadow(0 2px 3px rgba(120,100,70,.18))}
.cimg.sm{width:28px;height:28px;filter:none}
.tabbar button i img{width:26px;height:26px;object-fit:contain;display:block;margin:0 auto;opacity:.55;filter:saturate(.6);transition:all .25s}
.tabbar button.on i img{opacity:1;filter:drop-shadow(0 3px 5px rgba(120,100,70,.25))}
/* 진짜 걷는 캐릭터 */
#minis{height:110px}
.walker{animation:none;left:-140px;bottom:4px;transition:left 12s linear}
.walker .wc{height:96px;display:block;transform-origin:center;filter:drop-shadow(0 6px 6px rgba(90,70,40,.18))}
.walker.flip .wc{transform:scaleX(-1)}
.walker .heart{left:44px;top:-6px;animation:heart 16s linear infinite}
.roamer{position:fixed;left:0;top:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s;will-change:transform}
.roamer.on{opacity:1}
.roamer img{height:78px;display:block;filter:drop-shadow(0 6px 5px rgba(90,70,40,.2))}
.roamer.flip img{transform:scaleX(-1)}
/* 폼 칸이 화면 밖으로 넘치지 않게 */
.two>*{min-width:0}
.f input[type=datetime-local],.f input[type=date]{min-width:0;font-size:14px}
/* 이전 버튼 */
.navchips{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}
.navchips .backchip{position:static}
.navchips.plain{position:static}
/* 여행 목록 */
.tthumb{width:76px;height:76px;flex:none;border-radius:18px;background:#E9DCC8 center/cover no-repeat;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.tthumb span{position:absolute;left:6px;bottom:6px;font-family:'Outfit',sans-serif;font-weight:800;font-size:12px;color:#fff;background:rgba(34,37,58,.55);border-radius:8px;padding:1px 6px}
body.listmode #minis{bottom:calc(4px + env(safe-area-inset-bottom))}
.backchip{position:absolute;top:12px;left:12px;z-index:2;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 4px 12px rgba(90,70,40,.15);cursor:pointer}
.backchip.plain{position:static;box-shadow:none;background:var(--soft);color:var(--acc)}
.tripcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.tdate{width:54px;flex:none;text-align:center;border-radius:16px;padding:8px 0;background:linear-gradient(135deg,#F4EEE4,#EEF0FB)}
.tdate span{display:block;font-size:11px;color:var(--sub)}
.tdate b{font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tstat{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--line);color:var(--sub)}
.tstat.up{background:var(--soft);color:var(--acc)}
.tstat.now{background:var(--coralSoft);color:var(--coral)}
/* 분류별 색 */
.card.pc{background:var(--cbg);border:1px solid color-mix(in srgb,var(--cac) 22%,transparent);border-left:5px solid var(--cac);backdrop-filter:none;-webkit-backdrop-filter:none}
.card.pc .ico.img{background:rgba(255,255,255,.7)}
.cpill{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--cac);border-radius:999px;padding:1px 9px;margin-right:4px;vertical-align:1px}
.card.pc .btn{background:rgba(255,255,255,.75)}
.fchip.cc,.qcats button.cc{background:var(--cbg);border-color:color-mix(in srgb,var(--cac) 30%,transparent);color:var(--cac);font-weight:700}
.fchip.cc.on,.qcats button.cc.on{background:var(--cac);border-color:var(--cac);color:#fff}
@media (prefers-reduced-motion:reduce){#minis,.roamer{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<div id="app"></div>
<div id="minis" aria-hidden="true"><div class="walker"><img class="wc" src="img/walk-couple.webp" alt=""><span class="heart">♥</span></div></div>
<div class="quick" id="quick"><form id="qf"><div style="flex:1;min-width:0"><div class="qcats" id="qc"></div><input id="qn" placeholder="장소 이름 (선택)" style="width:100%;border:0;border-bottom:1px solid var(--line);background:none;outline:none;padding:6px 0;font-size:14px"><textarea id="qt" rows="1" placeholder="구글맵 주소·플러스코드 붙여넣기"></textarea><input id="qm" placeholder="메모 (선택) · 예: 저녁 7시 이후 추천" style="width:100%;border:0;border-top:1px solid var(--line);background:none;outline:none;padding:6px 0;font-size:14px"></div><button class="btn pri sm" style="padding:8px 14px">추가</button></form></div>

<script>
/* Vercel 독립 실행용: Claude 저장소 대신 /api/db(Upstash Redis) 사용 */
(function(){
  const API='/api/db',subs={},errs={},cache={},vers={};
  const gid=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-5);
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{for(const k in b)a[k]=isObj(b[k])&&isObj(a[k])?merge({...a[k]},b[k]):b[k];return a};
  const meta={fromCache:false,hasPendingWrites:false};
  const sdoc=(id,d)=>({id,exists:d!=null,data:()=>d==null?undefined:d,metadata:meta});
  const qs=docs=>{const a=Object.entries(docs||{}).map(([id,d])=>sdoc(id,d));return{docs:a,size:a.length,empty:!a.length,docChanges:()=>[],metadata:meta}};
  const emit=c=>(subs[c]||[]).forEach(f=>f(cache[c]||{}));
  let busy=false,again=false;
  async function sync(force){
    if(busy){again=true;return}busy=true;
    const want={};for(const c in subs)if(subs[c].length)want[c]=(force&&force.includes(c))||vers[c]==null?-1:vers[c];
    try{if(Object.keys(want).length){
      const r=await fetch(API+'?s='+encodeURIComponent(JSON.stringify(want)),{cache:'no-store'});const j=await r.json();if(!r.ok)throw j;
      for(const[c,v]of Object.entries(j.cols||{})){vers[c]=v.v;cache[c]=v.docs;emit(c)}}}
    catch(e){for(const c in errs)errs[c].forEach(f=>f({code:'unavailable',message:String(e&&e.error||e)}))}
    busy=false;if(again){again=false;sync()}
  }
  setInterval(()=>{if(!document.hidden)sync()},4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
  function sub(c,fn,err){(subs[c]=subs[c]||[]).push(fn);if(err)(errs[c]=errs[c]||[]).push(err);
    if(cache[c])setTimeout(()=>fn(cache[c]));else sync([c]);
    return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn);if(err)errs[c]=(errs[c]||[]).filter(x=>x!==err)}}
  async function fetchCol(c){if(cache[c])return cache[c];const r=await fetch(API+'?s='+encodeURIComponent(JSON.stringify({[c]:-1})),{cache:'no-store'});const j=await r.json();return (j.cols&&j.cols[c]&&j.cols[c].docs)||{}}
  async function write(op,path,data){
    const i=path.lastIndexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
    const nc={...(cache[c]||{})};
    if(op==='set')nc[id]=JSON.parse(JSON.stringify(data));else if(op==='update'){if(nc[id])nc[id]=merge(JSON.parse(JSON.stringify(nc[id])),data)}else delete nc[id];
    cache[c]=nc;emit(c);
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,path,data})});
    vers[c]=-2;setTimeout(()=>sync(),250);
    if(!r.ok){const e=await r.json().catch(()=>({}));throw{code:r.status===404?'invalid_argument':(r.status===400?'invalid_argument':'unavailable'),message:e.error||'저장 실패'}}
  }
  function doc(path){const i=path.lastIndexOf('/'),c=path.slice(0,i),id=path.slice(i+1);return{id,path,
    get:async()=>sdoc(id,(await fetchCol(c))[id]),set:d=>write('set',path,d),update:d=>write('update',path,d),delete:()=>write('delete',path),
    onSnapshot:(n,e)=>sub(c,docs=>n(sdoc(id,docs[id])),e),collection:p=>col(path+'/'+p),acquire:async()=>({acquired:true})}}
  function col(c){const self={path:c,doc:id=>doc(c+'/'+(id||gid())),add:async d=>{const r=doc(c+'/'+gid());await r.set(d);return r},
    get:async()=>qs(await fetchCol(c)),onSnapshot:(n,e)=>sub(c,docs=>n(qs(docs)),e)};self.where=self.orderBy=self.limit=()=>self;return self}
  const DB={doc,collection:col};
  const ASSETS={upload:async b=>{const r=await fetch('/api/upload?name='+encodeURIComponent(b.name||'file'),{method:'POST',headers:{'Content-Type':b.type||'application/octet-stream'},body:b});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw{message:j.error||'업로드 실패'};return j}};
  window.claude={use:n=>Promise.resolve(n==='db'?DB:n==='assets'?ASSETS:null)};
})();
</script>
<script>
/* ---------- 상태 ---------- */
const S={info:null,places:[],transport:[],stays:[],members:[],tab:'home',day:null,cat:'전체',bk:'transport',
  me:null,canWrite:true,names:{},roundTrip:true,fullMode:'walking',loaded:{},slow:false,offline:false};
let db=null,user=null,assets=null,sample=null,sampleImages=false;
const CATS=['관광','맛집','카페','쇼핑','숙소근처','기타'];
const MODES={'항공':'✈️','기차':'🚄','버스':'🚌','페리':'⛴️','렌터카':'🚗','지하철':'🚇','기타':'🧭'};
const MODE_IMG={'항공':'tr-air','기차':'tr-train','버스':'tr-bus','페리':'tr-ferry','렌터카':'tr-car','지하철':'tr-subway','기타':'tr-etc'};

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['일','월','화','수','목','금','토'];
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function iso(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtD(s){if(!s)return'';const d=parseD(s.slice(0,10));return`${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`}
function fmtDT(s){if(!s)return'';const t=s.split('T')[1];return fmtD(s)+(t?' '+t.slice(0,5):'')}
function nights(a,b){if(!a||!b)return 0;return Math.round((parseD(b)-parseD(a))/864e5)}
function tripDays(){const i=S.info;if(!i?.startDate||!i?.endDate||i.endDate<i.startDate)return[];const o=[];let c=i.startDate;while(c<=i.endDate&&o.length<60){o.push(c);c=addDays(c,1)}return o}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

function nameOf(id){return S.names[id]||''}
function parseJSON(t){if(!t)return null;const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}

/* 구글맵 링크/좌표 파싱 */
function parseMap(url){
  const r={};if(!url)return r;let u=url.trim();try{u=decodeURIComponent(u)}catch(e){}
  const m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||
    u.match(/[?&](?:q|query|ll|center|destination|daddr)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/)||
    u.match(/^\s*\(?\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*\)?\s*$/);
  if(m){const la=+m[1],ln=+m[2];if(Math.abs(la)<=90&&Math.abs(ln)<=180){r.lat=la;r.lng=ln}}
  const n=u.match(/\/place\/([^/@?]+)/);
  if(n)r.name=n[1].replace(/\+/g,' ').trim();
  else{const q=u.match(/[?&](?:q|query)=([^&]+)/);if(q&&!/^-?\d/.test(q[1]))r.name=q[1].replace(/\+/g,' ').trim()}
  r.short=/goo\.gl|maps\.app/.test(u);
  return r;
}
/* 구글맵 앱 공유 문구(이름\n주소\n링크) 또는 링크/좌표 */
function parseShare(text){
  const t=(text||'').trim();const um=t.match(/https?:\/\/\S+/);const url=um?um[0]:'';
  const r=parseMap(url||t);r.url=url;
  const lines=t.replace(url,'').split(/\n+/).map(s=>s.trim()).filter(s=>s&&!/^https?:/.test(s));
  if(url&&lines.length){if(!r.name)r.name=lines[0];if(lines[1])r.address=lines[1]}
  return r;
}
/* 플러스코드(Open Location Code) */
const OLC='23456789CFGHJMPQRVWX';
function olcDecode(code){let c=code.toUpperCase().replace('+','').replace(/0+$/,'');let lat=-90,lng=-180,res=20;const pr=Math.min(c.length,10);
  for(let i=0;i<pr;i+=2){lat+=OLC.indexOf(c[i])*res;lng+=OLC.indexOf(c[i+1])*res;if(i+2<pr)res/=20}
  let la=res,ln=res;for(let i=10;i<c.length;i++){const d=OLC.indexOf(c[i]);la/=5;ln/=4;lat+=Math.floor(d/4)*la;lng+=(d%4)*ln}
  return{lat:+(lat+la/2).toFixed(7),lng:+(lng+ln/2).toFixed(7)}}
function olcPrefix(lat,lng){let a=Math.min(Math.max(lat,-90),89.9999999)+90,b=((lng+180)%360+360)%360,res=20,s='';for(let i=0;i<4;i++){const x=Math.floor(a/res),y=Math.floor(b/res);s+=OLC[x]+OLC[y];a-=x*res;b-=y*res;res/=20}return s}
function olcRecover(short,ref){const pad=8-short.indexOf('+');const res=Math.pow(20,2-pad/2),half=res/2;
  let{lat,lng}=olcDecode(olcPrefix(ref.lat,ref.lng).slice(0,pad)+short.toUpperCase());
  if(ref.lat+half<lat&&lat-res>=-90)lat-=res;else if(ref.lat-half>lat&&lat+res<=90)lat+=res;
  if(ref.lng+half<lng)lng-=res;else if(ref.lng-half>lng)lng+=res;return{lat,lng}}
const SRC={code:'플러스코드',coord:'좌표',link:'구글맵 링크'};
const refCache={};
/* 주요 도시 기준점 (짧은 플러스코드는 기준 도시에서 반경 약 50km 안에서만 정확히 풀림) */

 [/고베|kobe|神戸/i,34.6901,135.1955],[/교토|kyoto|京都/i,35.0116,135.7681],[/오사카|osaka|大阪/i,34.6937,135.5023],[/나라|nara|奈良/i,34.6851,135.8048],

    if(ref){const d=olcRecover(short[1],ref);out.lat=d.lat;out.lng=d.lng;out.src='code'}else out.noref=true}
  if(short)addr=addr.replace(short[1],'');

  if(cm)addr=addr.replace(cm[0],'');

function hav(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLn=(b.lng-a.lng)*t;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

  const key=JSON.stringify([pts.map(p=>[p.lat,p.lng]),start&&[start.lat,start.lng],end&&[end.lat,end.lng]]);

  const cost=s=>{let c=0;if(start)c+=hav(start,pts[s[0]]);for(let i=0;i<s.length-1;i++)c+=hav(pts[s[i]],pts[s[i+1]]);if(end)c+=hav(pts[s[s.length-1]],end);return c};
  const idx=[...Array(n).keys()];let best,bc=Infinity;
  if(n<=8){const a=idx.slice();const perm=k=>{if(k===n){const c=cost(a);if(c<bc){bc=c;best=a.slice()}return}for(let i=k;i<n;i++){[a[k],a[i]]=[a[i],a[k]];perm(k+1);[a[k],a[i]]=[a[i],a[k]]}};perm(0)}

      while(left.size){let bi=-1,bd=Infinity;for(const j of left){const d=hav(cur,pts[j]);if(d<bd){bd=d;bi=j}}seq.push(bi);left.delete(bi);cur=pts[bi]}

function routeSVG(nodes){

  const pt=i=>[ox+(xs[i]-minX)*sc,oy+(ys[i]-minY)*sc];
  const line=nodes.map((n,i)=>pt(i).map(v=>v.toFixed(1)).join(',')).join(' ');
  let k=0,dots='';
  nodes.forEach((n,i)=>{const[x,y]=pt(i);if(n._home){if(!n._end)dots+=`<g><circle cx="${x}" cy="${y}" r="14" fill="#fff" opacity=".9"/><image href="img/ic-hotel.webp" x="${x-13}" y="${y-15}" width="26" height="26"/></g>`}

  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="동선 개략도"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C86DE"/><stop offset=".55" stop-color="#97B6E6"/><stop offset="1" stop-color="#EE8D76"/></linearGradient></defs><polyline points="${line}" fill="none" stroke="url(#rg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots.replace(/fill="var\(--acc\)"/g,'fill="url(#rg)"')}${nodes.length>1?`<g><g transform="translate(-16,-34)"><circle cx="10" cy="10" r="10.5" fill="#fff"/><image href="img/av-her.webp" width="20" height="20"/><circle cx="23" cy="10" r="10.5" fill="#fff"/><image href="img/av-me.webp" x="13" width="20" height="20"/></g><animateMotion dur="${Math.max(6,nodes.length*2.4)}s" repeatCount="indefinite" path="M${nodes.map((n,i)=>pt(i).map(v=>v.toFixed(1)).join(',')).join(' L')}"/></g>`:''}</svg>`;

    h+=`<div class="card"><b><img class="cimg h" src="img/ic-save.webp" alt="">구글맵에 이날 장소 저장하기</b><div class="hint" style="margin-bottom:8px">구글맵 앱의 ‘저장 목록’에 순서대로 담아 두면 여행 중 구글맵에서 바로 찾고 길찾기를 할 수 있어요.</div><button class="btn sm" data-act="saveGM">저장 도우미 열기</button></div>`;
  }
  if(pl.noXY.length){h+=`<div class="sec"><h2>위치가 없어 동선에서 빠진 곳</h2></div>`+pl.noXY.map(p=>placeCard(p,{noDay:false})).join('')}
  if(S.canWrite)h+=`<div style="text-align:center;margin-top:10px"><button class="btn sm" data-act="pick">+ 이날 갈 곳 더 고르기</button></div>`;

}

}

function placeSheet(p,focusLoc){
  const x=p||{day:S.tab==='plan'?S.day:''};F={lat:x.lat,lng:x.lng,xySrc:x.xySrc,summary:x.summary||'',tips:x.tips||[],address:x.address||'',url:x.mapUrl||''};
  openSheet(`<h3>${p?'장소 수정':'가고 싶은 곳 추가'}</h3><form id="fm">
   <div class="f"><label>구글맵 주소 · 플러스코드 · 좌표</label><textarea name="loc" rows="2" placeholder="예: MMFQ+2X 오사카 / 34.6687, 135.5013 / 주소">${esc(x.locText||x.address||x.mapUrl||'')}</textarea><div class="hint" id="xyHint"></div><div class="hint"><a href="#" data-help>정확한 위치 넣는 법 ›</a></div></div>
   <div id="aiCard"></div>
   <div class="f"><label>장소 이름</label><input name="name" value="${esc(x.name||'')}" required placeholder="예: 도톤보리"></div>
   <div class="two"><div class="f"><label>분류</label><select name="cat">${CATS.map(c=>`<option ${x.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
   <div class="f"><label>가는 날</label><select name="day">${dayOpts(x.day)}</select></div></div>
   <div class="f"><label>메모</label><input name="memo" value="${esc(x.memo||'')}" placeholder="예: 저녁 7시 이후 추천"></div>
   <div class="btns" style="justify-content:space-between">${p?delBtn:'<span></span>'}<span class="btns"><button type="button" class="btn" data-x>취소</button><button class="btn pri">저장</button></span></div></form>`,sh=>{
    const u=sh.querySelector('[name=loc]'),nm=sh.querySelector('[name=name]'),cat=sh.querySelector('[name=cat]'),hint=sh.querySelector('#xyHint'),card=sh.querySelector('#aiCard');
    sh.querySelector('[data-help]').onclick=e=>{e.preventDefault();helpSheet(()=>placeSheet(p,true))};
    let lastKey='',ac=null,tm=null,useq=0;
    const drawCard=(state)=>{
      if(state==='loading'){card.innerHTML=`<div class="card" style="background:var(--soft)"><span class="tiny">✨ 장소 정보를 요약하는 중…</span></div>`;return}
      if(!F.summary){card.innerHTML='';return}
      card.innerHTML=`<div class="card" style="background:var(--soft)"><div class="tiny" style="margin-bottom:4px">✨ AI 요약 <span class="tag warn">확인 필요</span></div>
        <div>${esc(F.summary)}</div>${F.tips?.length?`<div class="tiny" style="margin-top:6px">${F.tips.map(t=>'· '+esc(t)).join('<br>')}</div>`:''}
        <div class="btns" style="margin-top:8px"><button type="button" class="btn sm" data-resum>다시 요약</button><button type="button" class="btn sm ghost" data-clr>요약 지우기</button></div></div>`;
      card.querySelector('[data-resum]').onclick=()=>{lastKey='';summarize(true)};
      card.querySelector('[data-clr]').onclick=()=>{F.summary='';F.tips=[];drawCard()};
    };
    const summarize=async(force)=>{
      const name=nm.value.trim();if(!sample||(!name&&!F.address))return;
      const key=name+'|'+F.address;if(!force&&key===lastKey)return;lastKey=key;
      ac?.abort();ac=new AbortController();drawCard('loading');
      try{const j=await aiPlace(name,F.address,null,ac.signal);
        if(!j||j.known===false||!j.summary){F.summary='';card.innerHTML=`<div class="tiny" style="margin-bottom:10px">AI가 잘 모르는 곳이라 요약하지 못했어요.</div>`;if(j?.name&&!nm.value)nm.value=j.name;return}
        F.summary=j.summary;F.tips=(j.tips||[]).slice(0,3);
        if(CATS.includes(j.cat)&&!p)cat.value=j.cat;
        if(j.name&&!p&&(!nm.value||nm.dataset.auto)){nm.value=j.name;nm.dataset.auto=1}
        if(!hasXY(F)&&typeof j.lat==='number'&&typeof j.lng==='number'){F.lat=j.lat;F.lng=j.lng;F.xySrc='ai';showXY()}
        drawCard();
      }catch(err){if(err?.name==='AbortError')return;card.innerHTML=''}
    };
    const showXY=(st)=>{
      if(st==='loading'){hint.innerHTML='위치 확인 중…';return}
      const open=hasXY(F)?` <a class="btn sm" style="margin-top:6px" href="${esc(F.url||GM+'/search/?api=1&query='+ll(F))}" target="_blank" rel="noopener">구글맵에서 확인 ›</a>`:'';
      hint.innerHTML=(hasXY(F)?(F.xySrc==='ai'?`<span class="tag warn">대략적 위치 (AI 추정)</span> 정확히 하려면 플러스코드를 넣어 주세요`:`<span class="ok">📍 정확한 위치 (${SRC[F.xySrc]||'링크'})</span>`)
        :(st==='short'?'짧은 링크만으로는 위치를 알 수 없어요. 플러스코드나 주소를 넣어 주세요.':st==='noref'?'짧은 플러스코드는 기준 도시가 필요해요. 코드 뒤에 도시명을 붙여 주세요 (예: MMFQ+2X 오사카).':''))+open};
    const upd=async()=>{const seq=++useq;showXY('loading');const r=await resolveLoc(u.value);if(seq!==useq)return;
      F.url=r.url||'';F.locText=u.value.trim();
      if(hasXY(r)){F.lat=r.lat;F.lng=r.lng;F.xySrc=r.src}else if(F.xySrc!=='ai'||!u.value.trim()){F.lat=F.lng=undefined;F.xySrc=null}
      F.address=r.address||'';
      if(r.name&&(!nm.value||nm.dataset.auto)){nm.value=r.name;nm.dataset.auto=1}
      showXY(r.short?'short':r.noref?'noref':'');
      clearTimeout(tm);if(nm.value||F.address)tm=setTimeout(()=>summarize(),500)};
    let ut;u.oninput=()=>{clearTimeout(ut);ut=setTimeout(upd,350)};
    if(u.value&&!hasXY(F))upd();else showXY();drawCard();if(focusLoc)setTimeout(()=>u.focus(),50);
    nm.oninput=()=>{delete nm.dataset.auto;clearTimeout(tm);tm=setTimeout(()=>{if(!F.summary||!p)summarize()},1200)};
    sh.querySelector('[data-x]').onclick=()=>{ac?.abort();closeSheet()};
    bindDel(sh,()=>del('places',p.id));
    sh.querySelector('#fm').onsubmit=async e=>{e.preventDefault();ac?.abort();const v=fv(e.target);delete v.loc;
      const doc={...(p||{}),...v,catFixed:true,locText:u.value.trim(),mapUrl:F.url||'',summary:F.summary||'',tips:F.tips||[],address:F.address||'',lat:hasXY(F)?+F.lat:null,lng:hasXY(F)?+F.lng:null,xySrc:hasXY(F)?(F.xySrc||'link'):null,createdAt:p?.createdAt||Date.now(),createdBy:p?.createdBy||S.me||null};
      delete doc.id;const id=await put('places',p?.id,doc);closeSheet();
      if(!hasXY(doc)&&sample&&id)geocode('places',id,doc)}});
}

    if(!db){refreshLocal()}
    else{
      tripSubs.push(db.doc(infoPath(tid)).onSnapshot(sn=>{S.info=sn.exists?sn.data():null;S.loaded.trip=true;
        if(!sn.exists&&!sn.metadata.fromCache&&S.tid===tid){leaveTrip();return}render()},()=>{S.loaded.trip=true;render()}));
      TRIP_COLS.forEach(c=>tripSubs.push(db.collection(colPath(c,tid)).onSnapshot(q=>{if(S.tid!==tid)return;S[c]=q.docs.map(d=>({id:d.id,...d.data()}));if(c==='places')loadNames();render();clearTimeout(S._rp);S._rp=setTimeout(repairLocations,1500)},()=>{})));
    }}
  S.tab=tab;setHash();render();scrollTo(0,0);
}
function leaveTrip(){tripSubs.forEach(u=>{try{u()}catch(e){}});tripSubs=[];S.tid=null;S.info=null;TRIP_COLS.forEach(c=>S[c]=[]);setHash();render();scrollTo(0,0)}
/* 이전으로 가기: 앱 안에서 이동한 화면을 기억 */
const navStack=[];let goingBack=false;
function setHash(){const h=S.tid?`t-${S.tid}-${S.tab}`:'trips';const cur=location.hash.slice(1)||'trips';if(cur!==h){navStack.push(cur);if(navStack.length>50)navStack.shift();location.hash=h}}
function goBack(){
  if($('#sheetWrap').classList.contains('open')){closeSheet();return}
  if(!navStack.length){if(S.tid)leaveTrip();return}
  goingBack=true;const prev=navStack.pop();location.hash=prev;
}
function parseHash(){const h=location.hash.slice(1);const m=h.match(/^t-([A-Za-z0-9]+)-(home|places|plan|book)$/);return m?{tid:m[1],tab:m[2]}:null}
function fail(e){if(e?.code==='invalid_argument'){S.canWrite=false;render();toast('편집 권한이 없어 저장하지 못했어요')}else if(e?.code==='quota_exceeded')toast('저장 공간이 가득 찼어요. 오래된 항목을 지워 주세요');else toast('저장하지 못했어요. 다시 시도해 주세요');return null}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]'))return;
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.type==='checkbox')return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){S.tab=el.dataset.k;if(el.dataset.bk)S.bk=el.dataset.bk;if(S.tab==='places'&&el.closest('.sec'))S.cat='미정';setHash();render();scrollTo(0,0)}
  else if(a==='goDay'){S.day=el.dataset.d;S.tab='plan';setHash();render();scrollTo(0,0)}
  else if(a==='openTrip')enterTrip(id,'home');
  else if(a==='newTrip')tripSheet(true);
  else if(a==='backList')leaveTrip();
  else if(a==='goBack')goBack();
  else if(a==='day'){S.day=el.dataset.d;render()}
  else if(a==='cat'){S.cat=el.dataset.k;render()}
  else if(a==='bk'){S.bk=el.dataset.k;render()}
  else if(a==='editTrip')tripSheet(!S.tid);
  else if(a==='invite')inviteSheet();
  else if(a==='addP')placeSheet();
  else if(a==='editP')placeSheet(S.places.find(p=>p.id===id));
  else if(a==='addT')bookingSheet('transport');
  else if(a==='addS')bookingSheet('stays');
  else if(a==='editT'){if(S.canWrite)bookingSheet('transport',S.transport.find(x=>x.id===id))}
  else if(a==='editS'){if(S.canWrite)bookingSheet('stays',S.stays.find(x=>x.id===id))}
  else if(a==='pick')pickSheet();
  else if(a==='saveGM')saveGMSheet();
  else if(a==='autoOrder'){setDayOrder(S.day,null)}
  else if(a==='rSwap'){[S.rFrom,S.rTo]=[S.rTo,S.rFrom];render()}
  else if(a==='rMode'){S.rMode=el.dataset.k;render()}
  else if(a==='rLeg'){S.rFrom=el.dataset.a;S.rTo=el.dataset.b;render()}
  else if(a==='fixLoc')placeSheet(S.places.find(p=>p.id===id),true);
  else if(a==='help')helpSheet();
  else if(a==='unday')patch('places',id,{day:''});
  else if(a==='geo'){el.disabled=true;el.textContent='찾는 중…';const col=el.dataset.col;await geocode(col,id,S[col].find(x=>x.id===id))}
  else if(a==='geoAll'){el.disabled=true;for(const p of S.places.filter(p=>!hasXY(p)))await geocode('places',p.id,p)}
  else if(a==='fab'){if(S.tab==='places')placeSheet();else if(S.tab==='plan')pickSheet();else if(S.tab==='book')S.bk==='stays'?bookingSheet('stays'):bookingSheet('transport')}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='setDay')patch('places',el.dataset.id,{day:el.value});
  else if(el.dataset.act==='round'){S.roundTrip=el.checked;render()}
  else if(el.dataset.act==='fullMode'){S.fullMode=el.value;render()}
  else if(el.dataset.act==='rFrom'){S.rFrom=el.value;render()}
  else if(el.dataset.act==='rTo'){S.rTo=el.value;render()}
});
window.addEventListener('hashchange',()=>{const now=location.hash.slice(1)||'trips';
  if(goingBack)goingBack=false;else if(navStack[navStack.length-1]===now)navStack.pop();
  const r=parseHash();if(r){if(r.tid!==S.tid||r.tab!==S.tab)enterTrip(r.tid,r.tab)}else if(S.tid)leaveTrip()});

/* ---------- 시작 ---------- */
Object.assign(S,{tid:null,trips:[],legacy:null,tripDocs:[]});
render();
const use=n=>(window.claude&&typeof claude.use==='function')?claude.use(n).catch(()=>null):Promise.resolve(null);
(async()=>{
  [db,user,assets,sample]=await Promise.all(['db','user','assets','sample'].map(use));
  if(sample){try{const l=await sample.limits?.();sampleImages=!!l?.images}catch(e){}}
  if(user){try{const c=await user.can?.('data.write');if(c===false)S.canWrite=false}catch(e){}try{S.me=await user.id()}catch(e){}}
  const start=parseHash();
  if(!db){refreshLocal();if(start&&local.trips[start.tid])enterTrip(start.tid,start.tab);return}
  const timer=setTimeout(()=>{S.slow=true;render()},10000);
  const mergeTrips=()=>{S.trips=[...S.tripDocs,...(S.legacy?[{id:'legacy',...S.legacy}]:[])];};
  let got={t:false,l:false},started=false;
  const ready=()=>{if(!(got.t&&got.l))return;S.loaded.trips=true;clearTimeout(timer);S.slow=false;mergeTrips();
    if(!started){started=true;if(start)enterTrip(start.tid,start.tab);else if(S.trips.length===1&&S.legacy&&!S.tripDocs.length){render()}else render()}else render()};
  db.collection('trips').onSnapshot(q=>{S.tripDocs=q.docs.map(d=>({id:d.id,...d.data()}));if(!q.metadata.fromCache)got.t=true;else got.t=got.t||q.size>0;ready()},()=>{got.t=true;ready()});
  db.doc('trip/info').onSnapshot(sn=>{S.legacy=sn.exists?sn.data():null;if(!sn.metadata.fromCache)got.l=true;else got.l=got.l||sn.exists;ready()},()=>{got.l=true;ready()});
  db.collection('members').onSnapshot(q=>{S.members=q.docs.map(d=>({id:d.id,...d.data()}));loadNames();render()},()=>{});
  // 동행자 등록 (최초 1회)
  if(S.me&&S.canWrite){try{const ref=db.collection('members').doc(S.me);const g=await ref.get();if(!g.exists)await ref.set({joinedAt:Date.now()})}catch(e){}}
})();
/* ---------- 빠른 추가 ---------- */
let qCat='관광';
function drawQC(){$('#qc').innerHTML=CATS.map(c=>`<button type="button" data-qc="${c}" class="${qCat===c?'on':''} ${c!=='자동'?'cc':''}" style="${c!=='자동'?catVars(c):''}">${c==='자동'?'✨ 자동 분류':(catImg(c,'xs')+c)}</button>`).join('')}
drawQC();
$('#qc').addEventListener('click',e=>{const b=e.target.closest('[data-qc]');if(!b)return;qCat=b.dataset.qc;drawQC()});
async function aiPlace(name,address,xy,signal){
  const r=await sample(`여행 계획 앱에 저장할 장소 정보를 정리해줘. JSON 객체만 출력하고 설명은 쓰지 마.
${name?`장소 이름: "${name}"`:'장소 이름: (모름 — 아래 주소에 있는 장소/건물 이름을 알면 채워줘)'}${address?`\n주소: "${address}"`:''}${xy?`\n좌표: ${xy.lat}, ${xy.lng}`:''}\n여행지: "${S.info?.destination||''}"
형식: {"name":"정확한 장소명(현지명 있으면 '한국어명 (현지명)'), 모르면 주소를 짧게","cat":"관광|맛집|카페|쇼핑|숙소근처|기타 중 하나","summary":"어떤 곳인지 한국어 1~2문장","tips":["방문 팁 최대 3개, 각 20자 내외"],"lat":숫자 또는 null,"lng":숫자 또는 null,"known":true/false}
잘 모르는 장소면 known을 false, summary를 빈 문자열로 해. 지어내지 마.`,{modelTier:'quick',signal});
  return parseJSON(r.text);
}
async function enrich(id){
  const cur=S.places.find(x=>x.id===id)||local.places[id];if(!cur)return;
  try{const j=await aiPlace(cur.needName?'':cur.name,cur.address,hasXY(cur)?cur:null);
    const up={pending:false,needName:false};
    if(j){if(j.known!==false){if(j.summary)up.summary=j.summary;if(j.tips)up.tips=j.tips.slice(0,3);if(CATS.includes(j.cat)&&!cur.catFixed)up.cat=j.cat}
      if(j.name&&(cur.needName||j.known!==false))up.name=j.name;
      if(!hasXY(cur)&&typeof j.lat==='number'&&typeof j.lng==='number'){up.lat=j.lat;up.lng=j.lng;up.xySrc='ai'}}
    await patch('places',id,up);
  }catch(e){await patch('places',id,{pending:false,needName:false})}
}
$('#qt').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px'});
$('#qt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#qf').requestSubmit()}});
$('#qm').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#qf').requestSubmit()}});
$('#qn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#qt').focus()}});
$('#qf').addEventListener('submit',async e=>{e.preventDefault();const qt=$('#qt'),qn=$('#qn');const text=qt.value.trim(),nameIn=qn.value.trim();
  if(!text&&!nameIn)return;
  const btn=e.target.querySelector('button');btn.disabled=true;
  try{
    const r=await resolveLoc(text);
    if(r.short&&!r.address&&!nameIn&&!r.name){toast('짧은 링크만으로는 위치를 알 수 없어요. 주소나 플러스코드를 넣어 주세요');return}
    if(r.noref&&!r.address){toast('짧은 플러스코드 뒤에 도시명을 붙여 주세요 (예: MMFQ+2X 오사카)');return}
    const name=nameIn||r.name||'';
    const doc={name:name||(r.address||text).slice(0,24),needName:!name,locText:text,mapUrl:r.url||'',address:r.address||'',cat:qCat==='자동'?'기타':qCat,catFixed:qCat!=='자동',day:'',memo:($('#qm').value||'').trim(),summary:'',tips:[],
      lat:hasXY(r)?r.lat:null,lng:hasXY(r)?r.lng:null,xySrc:hasXY(r)?r.src:null,pending:!!sample,createdAt:Date.now(),createdBy:S.me||null};
    qt.value='';qn.value='';$('#qm').value='';qt.style.height='auto';
    toast(hasXY(r)?`📍 정확한 위치로 추가했어요 (${SRC[r.src]})`:'추가했어요 · 위치는 AI가 대략 추정해요');
    const id=await put('places',null,doc);if(id&&sample)enrich(id);
  }finally{btn.disabled=false}
});
/* ---------- 끌어서 순서 바꾸기 ---------- */
async function setDayOrder(day,ids){
  const doc=ids?{ids,manual:true,updatedAt:Date.now()}:{ids:[],manual:false,updatedAt:Date.now()};
  const cur=(S.dayOrder||[]).filter(d=>d.id!==day);S.dayOrder=[...cur,{id:day,...doc}];render();
  await put('dayOrder',day,doc);
}
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h||e.button>0)return;
  const el=h.closest('[data-stop]');if(!el)return;e.preventDefault();
  const list=[...document.querySelectorAll('[data-stop]')];
  drag={id:h.dataset.drag,el,list,ids:list.map(x=>x.dataset.stop),y0:e.clientY,sy0:scrollY,idx:list.indexOf(el),line:document.createElement('div')};
  drag.line.className='dropline';S.dragging=true;el.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(_){}
  try{navigator.vibrate?.(15)}catch(_){}
});
function dragMove(y){if(!drag)return;
  drag.el.style.transform=`translateY(${y-drag.y0+(scrollY-drag.sy0)}px)`;
  const others=drag.list.filter(x=>x!==drag.el);let idx=0;
  for(const o of others){const r=o.getBoundingClientRect();if(r.top+r.height/2<y)idx++}
  drag.idx=idx;drag.line.remove();
  if(idx<others.length)others[idx].before(drag.line);else others[others.length-1]?.after(drag.line);
}
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drag.lastY=e.clientY;dragMove(e.clientY);
  if(!drag.tick){drag.tick=setInterval(()=>{if(!drag)return;const y=drag.lastY;const dy=y<90?-12:y>innerHeight-150?12:0;if(dy){scrollBy(0,dy);dragMove(y)}},16)}},{passive:false});
function endDrag(cancel){if(!drag)return;const d=drag;drag=null;clearInterval(d.tick);d.line.remove();d.el.classList.remove('dragging');d.el.style.transform='';S.dragging=false;
  const rest=d.ids.filter(x=>x!==d.id);rest.splice(d.idx,0,d.id);
  if(!cancel&&rest.join()!==d.ids.join())setDayOrder(S.day,rest);else if(S.needRender){S.needRender=false;render()}}
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));
/* ---------- 캐릭터 연출: 둘이 함께 걷기 ↔ 따로 돌아다니기 ---------- */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const W=()=>innerWidth,H=()=>innerHeight;
  const walker=document.querySelector('#minis .walker');
  const mk=(id,walk,still)=>({el:document.getElementById(id),img:document.querySelector('#'+id+' img'),walk,still,x:-100,y:300});
  const place=(r,x,y)=>{r.el.style.transition='none';r.el.style.transform=`translate(${x}px,${y}px)`;r.x=x;r.y=y;void r.el.offsetWidth};
  async function walkTo(r,x,y){
    const d=Math.hypot(x-r.x,y-r.y),t=Math.max(.6,d/62);
    r.el.classList.toggle('flip',x<r.x);r.img.src=r.walk;
    r.el.style.transition=`transform ${t}s linear`;r.el.style.transform=`translate(${x}px,${y}px)`;r.x=x;r.y=y;
    await sleep(t*1000);r.img.src=r.still;
  }
  const bounds=()=>{const top=70,bot=H()-(document.body.classList.contains('qpad')?330:210);return{minX:8,maxX:Math.min(W(),760)-70,top,bot:Math.max(top+40,bot)}};
  async function roam(r){
    const b=bounds(),fromLeft=Math.random()<.5;
    place(r,fromLeft?-80:W()+20,b.top+Math.random()*(b.bot-b.top));r.el.classList.add('on');
    for(let i=0;i<3;i++){
      const nx=b.minX+Math.random()*(b.maxX-b.minX),ny=Math.min(b.bot,Math.max(b.top,r.y+(Math.random()*2-1)*140));
      await walkTo(r,nx,ny);await sleep(1200+Math.random()*2200);
    }
    await walkTo(r,Math.random()<.5?-90:W()+20,r.y);r.el.classList.remove('on');
  }
  let dir=1;
  async function together(){
    if(document.body.classList.contains('qpad')){await sleep(3000);return}
    walker.style.transition='none';walker.classList.toggle('flip',dir<0);walker.style.left=dir>0?'-140px':'100%';void walker.offsetWidth;
    /* 영상 속 디딤발이 뒤로 밀리는 속도(약 216px/s, 원본 기준)를 화면 크기(96/629)로 환산 ≈ 33px/s */
    const SPEED=216*(walker.querySelector('.wc').offsetHeight||96)/629;
    const dist=(document.getElementById('minis').clientWidth||innerWidth)+140,dur=dist/SPEED;
    walker.style.transition=`left ${dur.toFixed(2)}s linear`;walker.style.left=dir>0?'100%':'-140px';
    await sleep(dur*1000+400);dir=-dir;
  }
  (async function loop(){
    await sleep(1500);
    for(;;){
      if(document.hidden){await sleep(1500);continue}
      await together();
      await sleep(5000);
    }
  })();
})();
let nameT;
function loadNames(){clearTimeout(nameT);nameT=setTimeout(async()=>{if(!user?.profiles)return;const ids=[...new Set([...S.members.map(m=>m.id),...S.places.map(p=>p.createdBy).filter(Boolean)])];if(!ids.length)return;
  try{const ps=await user.profiles(ids);let ch=false;for(const id of ids){const n=ps?.[id]?.name||'';if(n&&S.names[id]!==n){S.names[id]=n;ch=true}}if(ch)render()}catch(e){}},200)}
</script>
